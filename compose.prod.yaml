services:
  app:
    image: ghcr.io/aled-studio/kairos-backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/kairosdb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_HOST: redis
      SENTRY_DSN: ${SENTRY_DSN}
      APP_VERSION: ${APP_VERSION}
    restart: unless-stopped
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kairos.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.kairos.entrypoints=websecure"
      - "traefik.http.routers.kairos.tls.certresolver=letsencrypt"
      - "traefik.http.services.kairos.loadbalancer.server.port=8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: 'postgres:18-alpine3.23'
    environment:
      POSTGRES_DB: kairosdb
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d kairosdb' ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: 'rabbitmq:4.2.5-alpine'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: [ 'CMD', 'rabbitmq-diagnostics', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:8.0-alpine'
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  web:
    external: true
  internal:
    internal: true

volumes:
  pgdata:
